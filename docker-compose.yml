services:
  receipt-lab:
    build:
      context: .
      dockerfile: service/Dockerfile
    restart: unless-stopped
    ports:
      - "8088:8000"
    env_file:
      - .env
    volumes:
      - paddle-models:/root/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  paddle-models:
